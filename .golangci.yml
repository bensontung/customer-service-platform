version: "2"
linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - gosec
    - revive
  settings:
    gosec:
      excludes:
        - G115
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
formatters:
  enable:
    - gofmt
run:
  timeout: 5m
