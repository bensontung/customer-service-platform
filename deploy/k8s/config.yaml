          envFrom:
            - configMapRef: {name: customer-service-config}
            - secretRef: {name: customer-service-secrets}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          readinessProbe:
            httpGet: {path: /health, port: 8082}
          livenessProbe:
            httpGet: {path: /health, port: 8082}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
