server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  location /api/ {
    proxy_pass http://console-api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
  }
  location / { try_files $uri $uri/ /index.html; }
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://g.alicdn.com; connect-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; frame-ancestors 'self' https://*.dingtalk.com;" always;
}
