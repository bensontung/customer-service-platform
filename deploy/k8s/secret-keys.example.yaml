apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: {name: customer-service-secrets}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: replace-with-secret-store, kind: ClusterSecretStore}
  target:
    name: customer-service-secrets
    creationPolicy: Owner
  data:
    - {secretKey: MYSQL_DSN, remoteRef: {key: replace/customer-service/mysql-dsn}}
    - {secretKey: AMQP_URL, remoteRef: {key: replace/customer-service/amqp-url}}
    - {secretKey: REDIS_PASSWORD, remoteRef: {key: replace/customer-service/redis-password}}
    - {secretKey: SESSION_SECRET, remoteRef: {key: replace/customer-service/session-secret}}
    - {secretKey: OBJECT_STORAGE_ACCESS_KEY, remoteRef: {key: replace/customer-service/object-storage-access-key}}
    - {secretKey: OBJECT_STORAGE_SECRET_KEY, remoteRef: {key: replace/customer-service/object-storage-secret-key}}
    - {secretKey: DINGTALK_APP_KEY, remoteRef: {key: replace/customer-service/dingtalk-app-key}}
    - {secretKey: DINGTALK_APP_SECRET, remoteRef: {key: replace/customer-service/dingtalk-app-secret}}
    - {secretKey: DINGTALK_CARD_API_SECRET, remoteRef: {key: replace/customer-service/dingtalk-card-api-secret}}
    - {secretKey: DINGTALK_CALLBACK_TOKEN, remoteRef: {key: replace/customer-service/dingtalk-callback-token}}
    - {secretKey: DINGTALK_CALLBACK_AES_KEY, remoteRef: {key: replace/customer-service/dingtalk-callback-aes-key}}
    - {secretKey: DINGTALK_CORP_ID, remoteRef: {key: replace/customer-service/dingtalk-corp-id}}
