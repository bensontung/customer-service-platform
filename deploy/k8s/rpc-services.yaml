apiVersion: apps/v1
kind: Deployment
metadata:
  name: conversation-rpc
spec:
  replicas: 2
  selector: {matchLabels: {app: conversation-rpc}}
  template:
    metadata: {labels: {app: conversation-rpc}}
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: conversation-rpc
          image: customer-service-conversation-rpc:replace-me
          ports: [{containerPort: 9101}]
          env:
            - {name: CONVERSATION_RPC_LISTEN_ON, value: "0.0.0.0:9101"}
          envFrom:
            - configMapRef: {name: customer-service-config}
            - secretRef: {name: customer-service-secrets}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
          readinessProbe: {grpc: {port: 9101}}
          livenessProbe: {grpc: {port: 9101}}
---
apiVersion: v1
kind: Service
metadata: {name: conversation-rpc}
spec:
  selector: {app: conversation-rpc}
  ports: [{port: 9101, targetPort: 9101}]
---
