services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: customer_service
      MYSQL_USER: app
      MYSQL_PASSWORD: local-development-only
      MYSQL_ROOT_PASSWORD: local-development-only
    ports: ["3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-plocal-development-only"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 3s, retries: 20}
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: local-development-only
    ports: ["5672:5672", "15672:15672"]
    healthcheck: {test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"], interval: 5s, retries: 30}
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: local-development
      MINIO_ROOT_PASSWORD: local-development-only
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 5s
      retries: 20
  minio-init:
    image: minio/mc:latest
    entrypoint: ["/bin/sh", "-c", "mc alias set local http://minio:9000 local-development local-development-only && mc mb --ignore-existing local/customer-service"]
    depends_on:
      minio: {condition: service_healthy}
  migrate:
    build: {context: .., dockerfile: deploy/Dockerfile, target: migrate}
    environment:
      MYSQL_DSN: ${LOCAL_MYSQL_DSN:?Set LOCAL_MYSQL_DSN from .env for local development}
    depends_on:
      mysql: {condition: service_healthy}
  console-api:
    build: {context: .., dockerfile: deploy/Dockerfile, target: console}
    environment: &app-environment
      MYSQL_DSN: ${LOCAL_MYSQL_DSN:?Set LOCAL_MYSQL_DSN from .env for local development}
      REDIS_ADDR: redis:6379
      AMQP_URL: ${LOCAL_AMQP_URL:?Set LOCAL_AMQP_URL from .env for local development}
      CONSOLE_BASE_URL: http://localhost:3000
      SESSION_SECRET: ${SESSION_SECRET:?Set a random local SESSION_SECRET of at least 32 bytes}
      DINGTALK_APP_KEY: ${DINGTALK_APP_KEY:-}
      DINGTALK_APP_SECRET: ${DINGTALK_APP_SECRET:-}
      DINGTALK_CARD_API_SECRET: ${DINGTALK_CARD_API_SECRET:-}
      DINGTALK_CARD_TEMPLATE_ID: ${DINGTALK_CARD_TEMPLATE_ID:-}
      DINGTALK_CALLBACK_ROUTE_KEY: ${DINGTALK_CALLBACK_ROUTE_KEY:-}
      DINGTALK_CALLBACK_TOKEN: ${DINGTALK_CALLBACK_TOKEN:-}
      DINGTALK_CALLBACK_AES_KEY: ${DINGTALK_CALLBACK_AES_KEY:-}
      DINGTALK_CORP_ID: ${DINGTALK_CORP_ID:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      WECHAT_COMMENT_SOURCES_JSON: ${WECHAT_COMMENT_SOURCES_JSON:-[]}
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_BUCKET: customer-service
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-local-development}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-local-development-only}
    ports: ["8080:8080"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
  ingress:
    build: {context: .., dockerfile: deploy/Dockerfile, target: ingress}
    environment: *app-environment
    ports: ["8081:8081"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  scheduler:
    build: {context: .., dockerfile: deploy/Dockerfile, target: scheduler}
    environment: *app-environment
    depends_on:
      migrate: {condition: service_completed_successfully}
      rabbitmq: {condition: service_healthy}
      redis: {condition: service_healthy}
  web:
    build: {context: ../web-console, dockerfile: Dockerfile}
    ports: ["3000:8080"]
    depends_on: [console-api]
    volumes: [web_cache:/var/cache/nginx, web_run:/var/run, web_tmp:/tmp]
volumes:
  mysql_data:
  minio_data:
  web_cache:
  web_run:
  web_tmp:
